apply plugin: "com.android.application"
apply plugin: "com.facebook.react"
apply plugin: "kotlin-android"

react {
    // Autolinking — react-native config resolves packages automatically.
    // No manual bundleConfig needed.
}

android {
    namespace "com.markerdetector"
    compileSdkVersion rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.markerdetector"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"

        // Enable C++ / CMake build for our OpenCV frame processor plugin
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
            }
        }

        ndk {
            // arm64-v8a  : modern phones (recommended)
            // armeabi-v7a: older 32-bit phones
            // x86_64     : emulators
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // Uncomment and fill in for release builds:
        // release {
        //     storeFile file(MYAPP_RELEASE_STORE_FILE)
        //     storePassword MYAPP_RELEASE_STORE_PASSWORD
        //     keyAlias MYAPP_RELEASE_KEY_ALIAS
        //     keyPassword MYAPP_RELEASE_KEY_PASSWORD
        // }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable true
        }
        release {
            signingConfig signingConfigs.debug  // Replace with signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
        }
    }

    // Split APKs by ABI — results in smaller per-device installs.
    // universalApk = true also produces one APK for all ABIs.
    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a"
            universalApk true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
    buildFeatures {
        prefab true
    }

    packagingOptions {
        pickFirst "**/libc++_shared.so"
        pickFirst "**/libfbjni.so"
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")

    // OpenCV Maven dependency (v4.9.0 supports Android natively)
    implementation 'org.opencv:opencv:4.9.0'

    // Vision Camera must be explicit so Kotlin can resolve its classes at compile time
    implementation project(':react-native-vision-camera')
    implementation project(':shopify_react-native-skia')
    implementation project(':react-native-reanimated')
    implementation project(':react-native-safe-area-context')
    implementation project(':react-native-screens')
    implementation project(':react-native-vector-icons')
}


// Tell Gradle to resolve local AARs from the libs/ directory
repositories {
    flatDir {
        dirs 'libs'
    }
}
