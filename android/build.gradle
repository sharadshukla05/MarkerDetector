// Top-level Android build configuration
buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 24
        compileSdkVersion = 34
        targetSdkVersion = 34
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.24"
        // OpenCV Android SDK version (download separately)
        opencvVersion = "4.9.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.2.2")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")
    }
}

plugins {
    id("com.facebook.react.rootproject")
}

subprojects {
    // Debug: println("Project path: ${project.path}")
    tasks.whenTaskAdded { task ->
        if (project.path.contains("skia")) {
            if (task.name.contains("merge") && task.name.contains("NativeLibs")) {
                // Link to ANY buildCMake or mergeJni tasks in ANY project containing "skia"
                // to resolve cross-project dependency issues caused by autolinking naming mismatches.
                task.dependsOn(rootProject.subprojects.findAll { it.path.contains("skia") }.collect { it.tasks.matching { it.name.contains("buildCMake") || it.name.contains("mergeDebugJniLibFolders") } })
            }
            if (task.name.contains("prefab") && task.name.contains("ConfigurePackage")) {
                task.dependsOn(rootProject.subprojects.findAll { it.path.contains("skia") }.collect { it.tasks.matching { it.name.contains("prepareHeaders") } })
            }
        }
    }
}
